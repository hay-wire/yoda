<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Personal EA{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 960px; margin: 0 auto; padding: 16px; line-height: 1.4; }
  nav { display: flex; gap: 16px; margin-bottom: 24px; border-bottom: 1px solid #8884; padding-bottom: 8px; flex-wrap: wrap; }
  nav a { text-decoration: none; color: inherit; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #8882; font-size: 14px; vertical-align: top; }
  tr.stale td { color: #c0392b; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 12px; background: #8882; }
  form.inline { display: inline; margin: 0; }
  input, select, textarea, button { font: inherit; padding: 5px 7px; }
  fieldset { margin-bottom: 20px; border: 1px solid #8884; border-radius: 6px; }
  legend { font-weight: 600; padding: 0 6px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .row label { display: flex; flex-direction: column; font-size: 12px; gap: 3px; flex: 1; min-width: 160px; }
  label textarea, label input { width: 100%; box-sizing: border-box; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .flash { background: #2ecc7133; padding: 8px 12px; border-radius: 6px; margin-bottom: 16px; }
  .muted { opacity: .65; font-size: 12px; }
</style>
</head>
<body>
<nav>
  <a href="{{ url_for('dashboard') }}">Pipeline</a>
  <a href="{{ url_for('companies') }}">Companies</a>
  <a href="{{ url_for('settings') }}">Settings</a>
  <a href="{{ url_for('logout') }}" style="margin-left:auto">Log out</a>
</nav>
{% block content %}{% endblock %}
</body>
</html>
