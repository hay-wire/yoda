{% extends "base.html" %}
{% block title %}Companies - Personal EA{% endblock %}
{% block content %}
<h1>Companies</h1>
<table>
<tr><th>Name</th><th>Email account</th><th></th></tr>
{% for c in companies %}
<tr>
  <td>{{ c.name }}</td>
  <td>{{ c.email_account or '' }}</td>
  <td><form class="inline" method="post" action="{{ url_for('company_delete', name=c.name) }}" onsubmit="return confirm('Remove this company mapping?')"><button>remove</button></form></td>
</tr>
{% else %}
<tr><td colspan="3">No companies yet.</td></tr>
{% endfor %}
</table>
<h2>Add company</h2>
<form method="post">
  <div class="row">
    <label>Name<input name="name" required></label>
    <label>Email account (optional)<input name="email_account"></label>
  </div>
  <button type="submit">Add</button>
</form>
{% endblock %}
